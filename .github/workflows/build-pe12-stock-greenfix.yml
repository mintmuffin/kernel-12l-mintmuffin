name: Build PE12 kernel (green screen fix only, no root)

# Same tree and same green-screen recovery patch as the rooted build, but
# without KernelSU/SUSFS: useful as a baseline and for users who do not want
# root on the device.

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - starlte      # Galaxy S9    (SM-G960F)
          - star2lte     # Galaxy S9+   (SM-G965F)
          - crownlte     # Galaxy Note9 (SM-N960F)

concurrency:
  group: pe12-stock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve devices
    runs-on: ubuntu-22.04
    outputs:
      devices: ${{ steps.devices.outputs.value }}
    steps:
      - id: devices
        run: |
          device='${{ github.event.inputs.device }}'
          if [ -z "$device" ] || [ "$device" = "all" ]; then
            echo 'value=["starlte","star2lte","crownlte"]' >> "$GITHUB_OUTPUT"
          else
            echo "value=[\"$device\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.device }}
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.setup.outputs.devices) }}

    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves \
            python3 make git curl unzip zip tar cpio lz4 \
            libncurses-dev device-tree-compiler patch

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain
          key: linaro-gcc-6.4.1-aarch64-16f73337

      - name: Fetch toolchain (Linaro GCC 6.4.1 aarch64, pinned)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          TOOLCHAIN_DIR="$RUNNER_TEMP/toolchain"
          # Fetch by commit hash: this repo has no lineage-19.1 branch, and a
          # shallow branch clone cannot check out an arbitrary SHA either.
          mkdir -p "$TOOLCHAIN_DIR"
          git -C "$TOOLCHAIN_DIR" init --quiet
          git -C "$TOOLCHAIN_DIR" remote add origin \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git
          git -C "$TOOLCHAIN_DIR" fetch --quiet --depth=1 origin \
            16f73337b3616cfe640b0130629a9569b30482ca
          git -C "$TOOLCHAIN_DIR" checkout --quiet FETCH_HEAD

      - name: Verify toolchain
        run: |
          "$RUNNER_TEMP/toolchain/bin/aarch64-linux-gnu-gcc" --version | head -1
          echo "TOOLCHAIN_BIN=$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_ENV"
      - name: Build kernel
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          export PATH="$TOOLCHAIN_BIN:$PATH"
          ./scripts/build.sh --device "${{ matrix.device }}" --root-solution none \
            --workdir "$RUNNER_TEMP/work" --jobs "$(nproc)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pe12-greenfix-${{ matrix.device }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/anykernel3-*.zip
            dist/boot_*.img
            dist/boot-*-ODIN.tar
