name: Build Official PE12 Kernel with Green Screen Fix, SukiSU & SUSFS

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'starlte'
        type: choice
        options:
          - starlte      # Galaxy S9    (SM-G960F)
          - star2lte     # Galaxy S9+   (SM-G965F)
          - crownlte     # Galaxy Note9 (SM-N960F)

jobs:
  build:
    name: Build PE12 SukiSU Kernel for ${{ github.event.inputs.device || 'starlte' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves \
            gcc-12-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 make git curl unzip tar cpio lz4 \
            libncurses-dev device-tree-compiler patch
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-12    /usr/local/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-12    /usr/local/bin/aarch64-linux-gnu-g++
          aarch64-linux-gnu-gcc --version
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Clone official PixelExperience 12 kernel tree
        run: |
          git clone --depth=1 --branch twelve https://github.com/PixelExperience-Devices/kernel_samsung_exynos9810.git kernel_src

      - name: Integrate SukiSU-Ultra with PE12 Manual Hooks
        run: |
          cd kernel_src
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU

          # Apply exact non-GKI hooks via Python
          python3 - <<'PYEOF'
          # 1. fs/exec.c
          with open('fs/exec.c', 'r') as f:
              c = f.read()
          exec_decl = '''
#ifdef CONFIG_KSU
static bool ksu_execveat_hook __read_mostly = false;
extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
#endif
'''
          if 'ksu_execveat_hook' not in c:
              c = c.replace('int do_execve(struct filename *filename,', exec_decl + '
int do_execve(struct filename *filename,')
              c = c.replace(
                  'struct user_arg_ptr envp = { .ptr.native = __envp };
	return do_execveat_common',
                  'struct user_arg_ptr envp = { .ptr.native = __envp };
#ifdef CONFIG_KSU
	if (unlikely(ksu_execveat_hook))
		ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
	else
		ksu_handle_execveat_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL);
#endif
	return do_execveat_common'
              )
              c = c.replace(
                  '.ptr.compat = __envp,
	};
	return do_execveat_common',
                  '.ptr.compat = __envp,
	};
#ifdef CONFIG_KSU
	if (!ksu_execveat_hook)
		ksu_handle_execveat_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL);
#endif
	return do_execveat_common'
              )
              with open('fs/exec.c', 'w') as f:
                  f.write(c)
              print("Patched fs/exec.c successfully!")

          # 2. drivers/input/input.c
          with open('drivers/input/input.c', 'r') as f:
              c = f.read()
          if 'ksu_input_hook' not in c:
              c = c.replace(
                  'void input_event(struct input_dev *dev,
		 unsigned int type, unsigned int code, int value)
{',
                  '#ifdef CONFIG_KSU
extern bool ksu_input_hook __read_mostly;
extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
#endif
void input_event(struct input_dev *dev,
		 unsigned int type, unsigned int code, int value)
{
#ifdef CONFIG_KSU
	if (unlikely(ksu_input_hook))
		ksu_handle_input_handle_event(&type, &code, &value);
#endif'
              )
              with open('drivers/input/input.c', 'w') as f:
                  f.write(c)
              print("Patched drivers/input/input.c successfully!")

          # 3. drivers/tty/pty.c
          with open('drivers/tty/pty.c', 'r') as f:
              c = f.read()
          if 'ksu_handle_devpts' not in c:
              c = c.replace(
                  'static struct tty_struct *pts_unix98_lookup(struct tty_driver *driver,
		struct file *file, int idx)
{',
                  '#ifdef CONFIG_KSU
extern int ksu_handle_devpts(struct inode*);
#endif
static struct tty_struct *pts_unix98_lookup(struct tty_driver *driver,
		struct file *file, int idx)
{
#ifdef CONFIG_KSU
	ksu_handle_devpts(file->f_path.dentry->d_inode);
#endif'
              )
              with open('drivers/tty/pty.c', 'w') as f:
                  f.write(c)
              print("Patched drivers/tty/pty.c successfully!")

          # 4. fs/open.c
          with open('fs/open.c', 'r') as f:
              c = f.read()
          if 'ksu_handle_faccessat' not in c:
              c = c.replace(
                  'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
{',
                  '#ifdef CONFIG_KSU
extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
#endif
SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
{
#ifdef CONFIG_KSU
	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
#endif'
              )
              with open('fs/open.c', 'w') as f:
                  f.write(c)
              print("Patched fs/open.c successfully!")

          # 5. fs/stat.c
          with open('fs/stat.c', 'r') as f:
              c = f.read()
          if 'ksu_handle_stat' not in c:
              c = c.replace(
                  'SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
		struct stat __user *, statbuf, int, flag)
{',
                  '#ifdef CONFIG_KSU
extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
#endif
SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
		struct stat __user *, statbuf, int, flag)
{
#ifdef CONFIG_KSU
	ksu_handle_stat(&dfd, &filename, &flag);
#endif'
              )
              with open('fs/stat.c', 'w') as f:
                  f.write(c)
              print("Patched fs/stat.c successfully!")
          PYEOF

          # Allow KSU without depending strictly on KPROBES
          sed -i 's/depends on KPROBES && EXT4_FS/depends on EXT4_FS/g' KernelSU/kernel/Kconfig

          # Copy KernelSU into drivers/kernelsu
          cp -r KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "SukiSU integrated successfully into drivers/kernelsu!"

      - name: Integrate SUSFS into Kernel
        run: |
          cd kernel_src
          # Copy susfs source files
          cp ../susfs_patches/susfs.c fs/
          cp ../susfs_patches/susfs.h include/linux/
          cp ../susfs_patches/susfs_def.h include/linux/

          # Apply SUSFS kernel patch
          patch -p1 --fuzz=3 < ../susfs_patches/50_add_susfs_in_kernel-4.9.patch || true
          echo "Applied SUSFS kernel patch!"

      - name: Apply Green Screen ALPM Fix
        run: |
          cd kernel_src
          git apply --verbose ../green_screen_fix.patch
          echo "Green screen fix patch applied successfully!"

      - name: Fix GCC 12 float incompatibility in DPU driver
        run: |
          cd kernel_src
          sed -i 's/const double decon_clocks_table/const unsigned long decon_clocks_table/g' drivers/video/fbdev/exynos/dpu_9810/decon_reg.c
          echo "Fixed decon_reg.c for GCC 12!"

      - name: Clean Makefiles of -Werror for GCC 12 compatibility
        run: |
          cd kernel_src
          python3 - <<'PYEOF'
          import os, re
          count = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.startswith('Makefile') or f.startswith('Kbuild') or f.endswith('.mk'):
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', errors='ignore') as fp:
                              content = fp.read()
                          if '-Werror' in content:
                              new_content = re.sub(r'-Werror[=a-zA-Z0-9_-]*', '', content)
                              with open(path, 'w') as fp:
                                  fp.write(new_content)
                              count += 1
                      except Exception:
                          pass
          print(f"Stripped -Werror from {count} Makefiles!")
          PYEOF

      - name: Configure Kernel with SUSFS, SukiSU & Stock Clocks
        run: |
          DEVICE="${{ github.event.inputs.device || 'starlte' }}"
          DEFCONFIG="exynos9810-${DEVICE}_defconfig"
          cd kernel_src

          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-mintmuffin-sukisu"/g' arch/arm64/configs/$DEFCONFIG
          cat << 'EOF' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_SU=y
          CONFIG_KPM=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MEMFD=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

          mkdir -p out
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out $DEFCONFIG

          # Verify SukiSU and SUSFS are preserved in .config
          echo "=== Checking .config for KSU and SUSFS ==="
          grep -E 'CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KPM' out/.config

      - name: Compile Kernel
        run: |
          JOBS=$(nproc)
          cd kernel_src

          EXTRA_KCFLAGS="-Wno-error -Wno-format -Wno-error=format \
            -Wno-address -Wno-nonnull \
            -Wno-implicit-fallthrough -Wno-unused-const-variable \
            -Wno-maybe-uninitialized -Wno-array-bounds -Wno-stringop-overflow \
            -Wno-misleading-indentation -Wno-missing-attributes \
            -Wno-packed-not-aligned -Wno-restrict -Wno-format-overflow \
            -Wno-enum-conversion -fno-pie"

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS="$EXTRA_KCFLAGS" -j${JOBS} Image dtbs
          echo "Kernel compiled successfully!"

          # Verify that SukiSU and SUSFS compiled into objects
          echo "=== Verifying compilation artifacts ==="
          ls -la out/drivers/kernelsu/
          ls -la out/fs/susfs.o

      - name: Append DTB to Image
        run: |
          DEVICE="${{ github.event.inputs.device || 'starlte' }}"
          DTB_DIR="kernel_src/out/arch/arm64/boot/dts/exynos"
          IMAGE="kernel_src/out/arch/arm64/boot/Image"
          OUT_IMAGE="kernel_src/out/arch/arm64/boot/Image-dtb"

          cat "$IMAGE" > "$OUT_IMAGE"
          for dtb in "$DTB_DIR"/exynos9810-${DEVICE}*.dtb; do
            if [ -f "$dtb" ]; then
              cat "$dtb" >> "$OUT_IMAGE"
              echo "Appended $dtb"
            fi
          done
          ls -lh "$OUT_IMAGE"

      - name: Package AnyKernel3 flashable zip
        run: |
          DEVICE="${{ github.event.inputs.device || 'starlte' }}"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          rm -rf .git
          sed -i "s/device.name1=.*/device.name1=${DEVICE}/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=universal9810/" anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=PE12 mintmuffin-sukisu Kernel (GreenFix+SukiSU+SUSFS)/' anykernel.sh
          cp ../kernel_src/out/arch/arm64/boot/Image-dtb Image
          find ../kernel_src/out/arch/arm64/boot/dts/exynos/ -name "*.dtb" -exec cp {} . \;
          zip -r9 ../anykernel3-${DEVICE}-pe12-sukisu-susfs-greenfix.zip *
          cd ..

          # Also create raw Image-dtb artifact
          cp kernel_src/out/arch/arm64/boot/Image-dtb Image-${DEVICE}-pe12-sukisu-susfs

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-${{ github.event.inputs.device || 'starlte' }}-pe12-sukisu-susfs
          path: anykernel3-${{ github.event.inputs.device || 'starlte' }}-pe12-sukisu-susfs-greenfix.zip

      - name: Upload Raw Image-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ github.event.inputs.device || 'starlte' }}-pe12-sukisu-susfs
          path: Image-${{ github.event.inputs.device || 'starlte' }}-pe12-sukisu-susfs
