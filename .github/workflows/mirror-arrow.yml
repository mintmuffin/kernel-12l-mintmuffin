name: Mirror ArrowOS 12.1 to GitHub Release

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download from SourceForge on Microsoft Cloud Backbone
        run: |
          curl -L -o Arrow-v12.1-starlte-OFFICIAL-20221116-GAPPS.zip \
            "https://master.dl.sourceforge.net/project/arrow-os/arrow-12.1/official/starlte/Arrow-v12.1-starlte-OFFICIAL-20221116-GAPPS.zip?viasf=1"
          ls -lh Arrow-v12.1-starlte-OFFICIAL-20221116-GAPPS.zip

      - name: Upload to Fast GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arrowos-v12.1
          name: ArrowOS 12.1 Fast CDN Mirror (starlte)
          files: Arrow-v12.1-starlte-OFFICIAL-20221116-GAPPS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
