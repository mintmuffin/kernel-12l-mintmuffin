name: Build Official PE12 Kernel with Green Screen Fix, KernelSU & SUSFS

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'starlte'
        type: choice
        options:
          - starlte      # Galaxy S9    (SM-G960F)
          - star2lte     # Galaxy S9+   (SM-G965F)
          - crownlte     # Galaxy Note9 (SM-N960F)

jobs:
  build:
    name: Build PE12 Kernel for ${{ github.event.inputs.device || 'starlte' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves \
            gcc-12-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 make git curl unzip tar cpio lz4 \
            libncurses-dev device-tree-compiler patch
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-12    /usr/local/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-12    /usr/local/bin/aarch64-linux-gnu-g++
          aarch64-linux-gnu-gcc --version
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Clone official PixelExperience 12 kernel tree
        run: |
          git clone --depth=1 --branch twelve https://github.com/PixelExperience-Devices/kernel_samsung_exynos9810.git kernel_src

      - name: Integrate KernelSU v1.0.3 & SUSFS
        run: |
          cd kernel_src
          git clone --depth=1 --branch v1.0.3 https://github.com/tiann/KernelSU.git KernelSU
          cd KernelSU
          
          # 1. Revert commit 898e9d4 (restore non-GKI manual hook compatibility)
          git apply --reverse ../../susfs_patches/revert_898.patch
          
          # 2. Apply SUSFS patch for KernelSU
          git apply ../../susfs_patches/10_enable_susfs_for_ksu.patch
          
          # 3. Allow CONFIG_KSU without KPROBES
          sed -i 's/depends on KPROBES && EXT4_FS/depends on EXT4_FS/g' kernel/Kconfig
          
          # 4. Disable kprobes in KernelSU code
          find kernel/ -type f -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +
          
          # 5. Add KernelSU Next signature to apk_sign.c (com.rifsxd.ksunext)
          python3 - <<'PYEOF'
          with open('kernel/apk_sign.c', 'r') as f:
              c = f.read()
          if '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7' not in c:
              target = 'check_v2_signature(path, 384, "7e0c6d7278a3bb8e364e0fcba95afaf3666cf5ff3c245a3b63c8833bd0445cc4")'
              replacement = target + ' ||\n\t\tcheck_v2_signature(path, 0x3e6, "79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7")'
              c = c.replace(target, replacement)
              with open('kernel/apk_sign.c', 'w') as f:
                  f.write(c)
          print("Added KernelSU Next signature to apk_sign.c!")
          PYEOF
          
          cd ..
          cp -r KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "KernelSU integrated into drivers/kernelsu successfully!"

      - name: Integrate SUSFS into Kernel
        run: |
          cd kernel_src
          cp ../susfs_patches/susfs.c fs/
          cp ../susfs_patches/susfs.h include/linux/
          cp ../susfs_patches/susfs_def.h include/linux/

          # Apply SUSFS kernel patch
          git apply --verbose ../susfs_patches/50_add_susfs_in_kernel-4.9.patch
          echo "Applied SUSFS kernel patch cleanly!"

      - name: Apply Non-GKI Manual Hooks to Kernel
        run: |
          cd kernel_src
          python3 - <<'PYEOF'
          # 1. fs/exec.c
          with open('fs/exec.c', 'r') as f:
              c = f.read()
          exec_decl = """#ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          			void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          				 void *argv, void *envp, int *flags);
          #endif
          """
          exec_target = 'static int do_execveat_common(int fd, struct filename *filename,\n\t\t\t      struct user_arg_ptr argv,\n\t\t\t      struct user_arg_ptr envp,\n\t\t\t      int flags)\n{\n\tchar *pathbuf = NULL;'
          exec_replacement = exec_decl + 'static int do_execveat_common(int fd, struct filename *filename,\n\t\t\t      struct user_arg_ptr argv,\n\t\t\t      struct user_arg_ptr envp,\n\t\t\t      int flags)\n{\n#ifdef CONFIG_KSU\n\tif (unlikely(ksu_execveat_hook))\n\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\telse\n\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\tchar *pathbuf = NULL;'
          if 'ksu_execveat_hook' not in c:
              assert exec_target in c, "exec_target not found in fs/exec.c!"
              c = c.replace(exec_target, exec_replacement)
              with open('fs/exec.c', 'w') as f:
                  f.write(c)
              print("Patched fs/exec.c cleanly!")

          # 2. fs/open.c
          with open('fs/open.c', 'r') as f:
              c = f.read()
          open_decl = """#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,
          			        int *flags);
          #endif
          """
          open_target = 'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n\tconst struct cred *old_cred;'
          open_replacement = open_decl + 'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\tconst struct cred *old_cred;'
          if 'ksu_handle_faccessat' not in c:
              assert open_target in c, "open_target not found in fs/open.c!"
              c = c.replace(open_target, open_replacement)
              with open('fs/open.c', 'w') as f:
                  f.write(c)
              print("Patched fs/open.c cleanly!")

          # 3. fs/read_write.c
          with open('fs/read_write.c', 'r') as f:
              c = f.read()
          rw_decl = """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
          			size_t *count_ptr, loff_t **pos);
          #endif
          """
          rw_target = 'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{\n\tssize_t ret;'
          rw_replacement = rw_decl + 'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{\n#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif\n\tssize_t ret;'
          if 'ksu_handle_vfs_read' not in c:
              assert rw_target in c, "rw_target not found in fs/read_write.c!"
              c = c.replace(rw_target, rw_replacement)
              with open('fs/read_write.c', 'w') as f:
                  f.write(c)
              print("Patched fs/read_write.c cleanly!")

          # 4. fs/stat.c
          with open('fs/stat.c', 'r') as f:
              c = f.read()
          stat_decl = """#ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          #endif
          """
          stat_target = 'int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,\n\t\tint flag)\n{\n\tstruct path path;\n\tint error = -EINVAL;\n\tunsigned int lookup_flags = 0;'
          stat_replacement = stat_decl + 'int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,\n\t\tint flag)\n{\n#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\tstruct path path;\n\tint error = -EINVAL;\n\tunsigned int lookup_flags = 0;'
          if 'ksu_handle_stat' not in c:
              assert stat_target in c, "stat_target not found in fs/stat.c!"
              c = c.replace(stat_target, stat_replacement)
              with open('fs/stat.c', 'w') as f:
                  f.write(c)
              print("Patched fs/stat.c cleanly!")

          # 5. drivers/input/input.c
          with open('drivers/input/input.c', 'r') as f:
              c = f.read()
          input_decl = """#ifdef CONFIG_KSU
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          #endif
          """
          input_target = 'static void input_handle_event(struct input_dev *dev,\n\t\t\t       unsigned int type, unsigned int code, int value)\n{\n\tint disposition = input_get_disposition(dev, type, code, &value);'
          input_replacement = input_decl + 'static void input_handle_event(struct input_dev *dev,\n\t\t\t       unsigned int type, unsigned int code, int value)\n{\n#ifdef CONFIG_KSU\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n\tint disposition = input_get_disposition(dev, type, code, &value);'
          if 'ksu_handle_input_handle_event' not in c:
              assert input_target in c, "input_target not found in drivers/input/input.c!"
              c = c.replace(input_target, input_replacement)
              with open('drivers/input/input.c', 'w') as f:
                  f.write(c)
              print("Patched drivers/input/input.c cleanly!")

          # 6. fs/namespace.c (SUSFS umount & devname helpers for KernelSU)
          with open('fs/namespace.c', 'r') as f:
              c = f.read()
          ns_append = """
#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
#ifndef DEFAULT_SUS_MNT_ID
#define DEFAULT_SUS_MNT_ID 100000
#endif
extern void susfs_try_umount_all(uid_t uid);
void susfs_run_try_umount_for_current_mnt_ns(void) {
	struct mount *mnt;
	struct mnt_namespace *mnt_ns;

	mnt_ns = current->nsproxy->mnt_ns;
	namespace_lock();
	list_for_each_entry(mnt, &mnt_ns->list, mnt_list) {
		if (mnt->mnt_id >= DEFAULT_SUS_MNT_ID) {
			change_mnt_propagation(mnt, MS_PRIVATE);
		}
	}
	namespace_unlock();
	susfs_try_umount_all(current_uid().val);
}
#else
void susfs_run_try_umount_for_current_mnt_ns(void) {}
#endif

#ifdef CONFIG_KSU_SUSFS
bool susfs_is_mnt_devname_ksu(struct path *path) {
	struct mount *mnt;

	if (path && path->mnt) {
		mnt = real_mount(path->mnt);
		if (mnt && mnt->mnt_devname && !strcmp(mnt->mnt_devname, "KSU")) {
			return true;
		}
	}
	return false;
}
#else
bool susfs_is_mnt_devname_ksu(struct path *path) {
	return false;
}
#endif
"""
          if 'susfs_run_try_umount_for_current_mnt_ns' not in c:
              c += ns_append
              with open('fs/namespace.c', 'w') as f:
                  f.write(c)
              print("Patched fs/namespace.c with susfs helpers cleanly!")
          PYEOF
          echo "All non-GKI manual hooks applied successfully!"

      - name: Apply Green Screen ALPM Fix
        run: |
          cd kernel_src
          git apply --verbose ../green_screen_fix.patch
          echo "Green screen fix patch applied successfully!"

      - name: Fix GCC 12 float incompatibility in DPU driver
        run: |
          cd kernel_src
          sed -i 's/const double decon_clocks_table/const unsigned long decon_clocks_table/g' drivers/video/fbdev/exynos/dpu_9810/decon_reg.c
          echo "Fixed decon_reg.c for GCC 12!"

      - name: Clean Makefiles of -Werror for GCC 12 compatibility
        run: |
          cd kernel_src
          python3 - <<'PYEOF'
          import os, re
          count = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.startswith('Makefile') or f.startswith('Kbuild') or f.endswith('.mk'):
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', errors='ignore') as fp:
                              content = fp.read()
                          if '-Werror' in content:
                              new_content = re.sub(r'-Werror[=a-zA-Z0-9_-]*', '', content)
                              with open(path, 'w') as fp:
                                  fp.write(new_content)
                              count += 1
                      except Exception:
                          pass
          print(f"Stripped -Werror from {count} Makefiles!")
          PYEOF

      - name: Configure Kernel with SUSFS, KernelSU & Stock Clocks
        run: |
          DEVICE="${{ github.event.inputs.device || 'starlte' }}"
          DEFCONFIG="exynos9810-${DEVICE}_defconfig"
          cd kernel_src

          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-mintmuffin-mafushii"/g' arch/arm64/configs/$DEFCONFIG
          cat << 'EOF' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          mkdir -p out
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out $DEFCONFIG

          # Verify KSU and SUSFS are preserved in .config
          echo "=== Checking .config for KSU and SUSFS ==="
          grep -E 'CONFIG_KSU|CONFIG_KALLSYMS' out/.config

      - name: Compile Kernel
        run: |
          cd kernel_src
          make -j$(nproc --all) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out

      - name: Append DTB to Image
        run: |
          cd kernel_src
          DEVICE="${{ github.event.inputs.device || 'starlte' }}"
          DTB_PATH="out/arch/arm64/boot/dts/exynos/exynos9810-${DEVICE}.dtb"
          if [ -f "$DTB_PATH" ]; then
            cat out/arch/arm64/boot/Image "$DTB_PATH" > out/arch/arm64/boot/Image-dtb
            echo "Successfully generated Image-dtb with appended device DTB!"
          else
            echo "Device DTB not found at $DTB_PATH, finding all generated DTBs..."
            find out/arch/arm64/boot/dts/ -name "*.dtb"
            cp out/arch/arm64/boot/Image out/arch/arm64/boot/Image-dtb
          fi

      - name: Package AnyKernel3 flashable zip
        run: |
          DEVICE="${{ github.event.inputs.device || 'starlte' }}"
          mkdir -p anykernel3_pkg
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3_pkg/
          cp kernel_src/out/arch/arm64/boot/Image-dtb anykernel3_pkg/Image

          # Configure anykernel.sh for Exynos 9810
          sed -i "s/device.name1=.*/device.name1=${DEVICE}/g" anykernel3_pkg/anykernel.sh
          sed -i "s/device.name2=.*/device.name2=starlte/g" anykernel3_pkg/anykernel.sh
          sed -i "s/device.name3=.*/device.name3=star2lte/g" anykernel3_pkg/anykernel.sh
          sed -i "s/device.name4=.*/device.name4=crownlte/g" anykernel3_pkg/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=\/dev\/block\/platform\/11120000.ufs\/by-name\/boot;/g' anykernel3_pkg/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=0;/g' anykernel3_pkg/anykernel.sh

          cd anykernel3_pkg
          zip -r9 ../anykernel3-${DEVICE}-pe12-ksu-susfs-greenfix.zip * -x .git README.md *placeholder
          cd ..
          echo "AnyKernel3 package created: anykernel3-${DEVICE}-pe12-ksu-susfs-greenfix.zip"

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-${{ github.event.inputs.device || 'starlte' }}-pe12-ksu-susfs-greenfix
          path: anykernel3-*-pe12-ksu-susfs-greenfix.zip
          retention-days: 14

      - name: Upload Raw Image-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ github.event.inputs.device || 'starlte' }}-pe12-ksu-susfs
          path: kernel_src/out/arch/arm64/boot/Image-dtb
          retention-days: 14
