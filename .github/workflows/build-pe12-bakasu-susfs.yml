name: Build PE12 kernel (BakaSU + SUSFS + green screen fix)

# Galaxy S9 (starlte / SM-G960F) only.
#
# BakaSU (formerly ReSukiSU, a SukiSU-Ultra downstream) + SUSFS v2.3.0
# on the PixelExperience twelve (Linux 4.9.319) Exynos 9810 tree.
#
# Toolchain: Linaro GCC 6.4.1 aarch64 prebuilt, pinned. This is the
# era-correct toolchain for a 4.9 tree and is what the builds are verified
# with; the distro GCC 12 breaks this vendor code in ways that need more
# patches than it is worth.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/build-pe12-bakasu-susfs.yml'

concurrency:
  group: pe12-bakasu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: starlte
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves \
            python3 make git curl unzip zip tar cpio lz4 \
            libncurses-dev device-tree-compiler patch

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain
          key: linaro-gcc-6.4.1-aarch64-16f73337

      - name: Fetch toolchain (Linaro GCC 6.4.1 aarch64, pinned)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          TOOLCHAIN_DIR="$RUNNER_TEMP/toolchain"
          # Fetch by commit hash: this repo has no lineage-19.1 branch, and a
          # shallow branch clone cannot check out an arbitrary SHA either.
          mkdir -p "$TOOLCHAIN_DIR"
          git -C "$TOOLCHAIN_DIR" init --quiet
          git -C "$TOOLCHAIN_DIR" remote add origin \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git
          git -C "$TOOLCHAIN_DIR" fetch --quiet --depth=1 origin \
            16f73337b3616cfe640b0130629a9569b30482ca
          git -C "$TOOLCHAIN_DIR" checkout --quiet FETCH_HEAD

      - name: Verify toolchain
        run: |
          "$RUNNER_TEMP/toolchain/bin/aarch64-linux-gnu-gcc" --version | head -1
          echo "TOOLCHAIN_BIN=$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_ENV"

      - name: Build kernel
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          export PATH="$TOOLCHAIN_BIN:$PATH"
          ./scripts/build.sh --device starlte \
            --workdir "$RUNNER_TEMP/work" --jobs "$(nproc)"

      - name: Show what we are shipping
        run: |
          ls -l dist
          unzip -l dist/anykernel3-*-pe12-bakasu-susfs.zip | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pe12-bakasu-susfs-starlte
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/anykernel3-*.zip
            dist/boot_*.img
            dist/boot-*-ODIN.tar
